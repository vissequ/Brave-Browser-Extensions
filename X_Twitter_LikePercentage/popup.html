<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Plugin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            min-width: 200px;
        }
        label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        input[type="checkbox"] {
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <label>
        Enable Plugin
        <input type="checkbox" id="togglePlugin">
    </label>
    <script src="popup.js"></script>
</body>
</html>
